<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire: Additional</title>
    <link rel="stylesheet" href="../../css/questionnaire.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="page-frame">
        <div class="side side--left"></div>
        <main class="content">
            <h1 class="questionnaire-heading">LET’S FIND A ROOMMATE!</h1>
            <h2 class="questionnaire-subheading">ENTER THE DETAILS THAT YOU WOULD LIKE TO SHARE ABOUT YOURSELF</h2>
            <!--Create a progress bar graphical component and insert here-->
            <hr class="questionnaire-divider">
            <h1 class="questionnaire-heading">STEP 5: EXTRA</h1>
            <h2 class="questionnaire-subheading" style="margin-bottom: 0px;">PHOTO GALLERY</h2>
            <h3 class="questionnaire-description" style="text-align: center; margin-top: 0px;">ATTACH ADDITIONAL PHOTOS TO SHOW OFF IN YOUR GALLERY</h3>
            <!--Implement image upload functionality-->
            <hr class="questionnaire-subdivider">
            <h2 class="questionnaire-subheading">SOCIAL MEDIA</h2>
            <div class="questionnaire-row">
                <label class="questionnaire-row-label" for="firstName"><i class="fa fa-instagram" style="color: #006b54"></i></label>
                <input id="firstName" class="questionnaire-input" type="text" placeholder="Instagram Handle" />
            </div>
            <div class="questionnaire-row">
                <label class="questionnaire-row-label" for="firstName"><i class="fa fa-facebook" style="color: #006b54"></i></label>
                <input id="firstName" class="questionnaire-input" type="text" placeholder="Facebook Handle" />
            </div>
            <div class="questionnaire-row">
                <label class="questionnaire-row-label" for="firstName"><i class="fa fa-snapchat" style="color: #006b54;"></i></label>
                <input id="firstName" class="questionnaire-input" type="text" placeholder="Snapchat Handle" />
            </div>
            <button class="questionnaire-continue" onclick="window.location.href='lifestyle.html'">CONTINUE</button>



        </main>
        <div class="side side--right"></div>
    </div>
</body>

</html>
