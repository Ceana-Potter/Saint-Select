<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire: Interests</title>
    <link rel="stylesheet" href="../../css/questionnaire.css">
</head>

<body>
    <div class="page-frame">
        <div class="side side--left"></div>
        <main class="content">
            <h1 class="questionnaire-heading">LET’S FIND A ROOMMATE!</h1>
            <h2 class="questionnaire-subheading">ENTER THE DETAILS THAT YOU WOULD LIKE TO SHARE ABOUT YOURSELF</h2>
            <!--Create a progress bar graphical component and insert here-->
            <hr class="questionnaire-divider">
            <h1 class="questionnaire-heading">STEP 2: INTERESTS</h1>
            <h2 class="questionnaire-subheading">SELECT YOUR HOBBIES</h2>
            <form>
                <div class="hobby-grid">
                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="photography" />
                        <span>📷 Photography</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="music" />
                        <span>🎵 Music</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="" />
                        <span>📚 Reading</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Exercise" />
                        <span>🏋️ Exercise</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Video Games" />
                        <span>🎮 Video Games</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="TV-Movie" />
                        <span>🍿 TV & Movies</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Art" />
                        <span>🎨 Art</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Cooking" />
                        <span>🍳 Cooking</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Writing" />
                        <span>✍️ Writing</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Hiking" />
                        <span>🥾 Hiking</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Travel" />
                        <span>✈️ Travel</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Thrifting" />
                        <span>🛍️ Thrifting</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Volunteering" />
                        <span>🤝 Volunteering</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Meditation" />
                        <span>🧘 Meditation</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Sports" />
                        <span>⚽ Sports</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Chess" />
                        <span>♟️ Chess</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Fishing" />
                        <span>🎣 Fishing</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Gardening" />
                        <span>🌱 Gardening</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Crafts" />
                        <span>🧵 Crafts</span>
                    </label>
                </div>
            </form>

            <hr class="questionnaire-subdivider">
            <h2 class="questionnaire-subheading">SELECT YOUR MUSIC TASTE</h2>
            <form>
                <div class="hobby-grid">
                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Rock" />
                        <span>🎸 Rock</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Pop" />
                        <span>🎶 Pop</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Hip-Hop" />
                        <span>🎧 Hip-Hop</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Rap" />
                        <span>🎤 Rap</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Country" />
                        <span>🤠 Country</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Jazz" />
                        <span>🥁 Jazz</span>
                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Lofi" />

                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="RnB" />

                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Latin" />

                    </label>

                    <label class="hobby-pill">
                        <input type="checkbox" name="hobbies" value="Classical" />
                        <span>🎻 Classical</span>
                    </label>
                </div>
            </form>
            <button class="questionnaire-continue" onclick="window.location.href='lifestyle.html'">CONTINUE</button>



        </main>
        <div class="side side--right"></div>
    </div>
</body>

</html>
