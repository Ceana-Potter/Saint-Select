<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire: Lifestyle</title>
    <link rel="stylesheet" href="../../css/questionnaire.css">
</head>

<body>
    <div class="page-frame">
        <div class="side side--left"></div>
        <main class="content">
            <h1 class="questionnaire-heading">LET’S FIND A ROOMMATE!</h1>
            <h2 class="questionnaire-subheading">ENTER THE DETAILS THAT YOU WOULD LIKE TO SHARE ABOUT YOURSELF</h2>
            <!--Create a progress bar graphical component and insert here-->
            <hr class="questionnaire-divider">
            <h1 class="questionnaire-heading">STEP 3: LIFESTYLE</h1>
            <h2 class="questionnaire-subheading" style="text-align: left;">CLEANLINESS</h2>


            <div class="scale-wrap">
                <!-- labels ABOVE the gray bar -->
                <div class="scale-label-row">
                    <span></span>
                    <div class="scale-labels">
                        <span class="radio-text label-start">NO PREFERENCE</span>
                        <span class="radio-text label-middle">CASUAL</span>
                        <span class="radio-text label-end">VERY TIDY</span>
                    </div>
                </div>

                <!-- gray bar -->
                <div class="scale-row">
                    <p class="scale-question">How tidy do you like your space?</p>

                    <fieldset class="scale-radios">
                        <legend></legend>

                        <label class="radio-option">
                            <input class="radio-input" type="radio" name="cleanliness" value="1" />
                            <span class="radio-control"></span>
                        </label>

                        <label class="radio-option">
                            <input class="radio-input" type="radio" name="cleanliness" value="2" />
                            <span class="radio-control"></span>
                        </label>

                        <label class="radio-option">
                            <input class="radio-input" type="radio" name="cleanliness" value="3" />
                            <span class="radio-control"></span>
                        </label>

                        <label class="radio-option">
                            <input class="radio-input" type="radio" name="cleanliness" value="4" />
                            <span class="radio-control"></span>
                        </label>

                        <label class="radio-option">
                            <input class="radio-input" type="radio" name="cleanliness" value="5" />
                            <span class="radio-control"></span>
                        </label>
                    </fieldset>
                </div>
            </div>




            <hr class="questionnaire-subdivider">
            Put hobby buttons here
            <button class="questionnaire-continue">CONTINUE</button>



        </main>
        <div class="side side--right"></div>
    </div>
</body>

</html>
